[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adwsdomaindump"
version = "0.11.0"
description = "Active Directory information dumper via ADWS"
authors = [
  { name = "mverschu" }
]
urls = { "Homepage" = "https://github.com/dirkjanm/ldapdomaindump/" }
requires-python = ">=3.6"
license = {text = "MIT"}
dependencies = [
  "dnspython",
  "impacket>=0.11.0",
  "pycryptodomex"
]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false

[tool.setuptools.package-data]
adwsdomaindump = ["style.css"]

[project.scripts]
adwsdomaindump = "adwsdomaindump:main"
adwsd2bloodhound = "adwsdomaindump.convert:ldd2bloodhound"
adwsd2pretty = "adwsdomaindump.pretty:main"
