name: Sync wiki

# GitHub does not create the *.wiki.git repo until the first wiki page exists.
# One-time setup: open https://github.com/mverschu/adwsdomaindump/wiki/_new ,
# create a page titled "Home" (any placeholder text), then re-run this workflow.
#
# Optional: add repo secret WIKI_PUSH_TOKEN (PAT with repo / Contents read+write)
# if GITHUB_TOKEN cannot push to the wiki repo.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare wiki payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/wiki-payload
          cp wiki/*.md /tmp/wiki-payload/
          rm -f /tmp/wiki-payload/README.md

      - name: Publish to GitHub wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          workdir="/tmp/wiki-repo"

          if [[ "${WIKI_TOKEN}" == ghp_* || "${WIKI_TOKEN}" == github_pat_* ]]; then
            wiki_url="https://${{ github.actor }}:${WIKI_TOKEN}@github.com/${repo}.wiki.git"
          else
            wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${repo}.wiki.git"
          fi

          rm -rf "${workdir}"
          if git clone "${wiki_url}" "${workdir}" 2>/dev/null; then
            rsync -av --delete --exclude .git /tmp/wiki-payload/ "${workdir}/"
            cd "${workdir}"
            git add -A
            if git diff --staged --quiet; then
              echo "Wiki already up to date"
              exit 0
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Sync wiki from ${GITHUB_SHA}"
            git push
            exit 0
          fi

          echo "::warning::Wiki git repo not found. Create the first page at https://github.com/${repo}/wiki/_new then re-run this workflow."
          cd /tmp/wiki-payload
          git init
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Initial wiki from ${GITHUB_SHA}"
          for branch in master main; do
            git branch -M "${branch}"
            git remote remove origin 2>/dev/null || true
            git remote add origin "${wiki_url}"
            if git push -f origin "${branch}" 2>/dev/null; then
              echo "Published wiki on branch ${branch}"
              exit 0
            fi
          done
          echo "::error::Could not push wiki. Create the first page manually, set WIKI_PUSH_TOKEN if needed, then re-run."
          exit 1
